<!DOCTYPE html>
<html>
<head>
	<title>Таблицы</title>
	<link href="style.css" rel="stylesheet">
</head>
<body>
 <div id="menu"><script language="JavaScript" src="menu.js" type="text/javascript"></script></div>
<script>
var n = prompt("Введите размер таблицы:", 15);

document.write("<table cellspacing='2'>");
for (var i = 0; i < n; i++) {
    document.write("<tr>");
    for (var j = 0; j < n; j++) {
        if (j < n - i - 1)
            var color = "deepskyblue";
        else
            var color = "#007bff";
        document.write("<td width='20' height='20' bgcolor='" + color + "'></td>");
    }
    document.write("</tr>");
}
document.write("</table>");
</script>
</body>
</html>
