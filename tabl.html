<!DOCTYPE html>
<html>
<head>
	<title>Таблицы</title>
	<link href="style.css" rel="stylesheet">
</head>
<body>
 <div id="menu"><script language="JavaScript" src="menu.js" type="text/javascript"></script></div>
	<script>
		        document.write("<table border='1' cellpadding='0' cellspacing='2'>");

        for (var i = 0; i < 15; i++) {
            document.write("<tr>");
            for (var j = 0; j < 15; j++) {
                var t = (i + j) / 28;
                var r = Math.round(100 * t);
                var g = Math.round(220 - 220 * t);
                var b = Math.round(255 - 75 * t);
                document.write("<td width='25' height='25' bgcolor='rgb(" + r + "," + g + "," + b + ")'></td>");
            }
            document.write("</tr>");
        }

        document.write("</table>");
	</script>
</body>
</html>
