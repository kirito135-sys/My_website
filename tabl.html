
<!DOCTYPE html>
<html>
<body>
<script>
var n = prompt("Введите размер таблицы:", 15);

document.write("<table cellspacing='2'>");
for (var i = 0; i < n; i++) {
    document.write("<tr>");
    for (var j = 0; j < n; j++) {
        if (j < n - i - 1)
            var color = "deepskyblue";
        else
            var color = "blueviolet";
        document.write("<td width='20' height='20' bgcolor='" + color + "'></td>");
    }
    document.write("</tr>");
}
document.write("</table>");
</script>
</body>
</html>
