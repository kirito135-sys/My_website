<!DOCTYPE html>
<html>
<head>
    <title>Динамическое изменение</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript">
        var arr = ["Ivanov", "Petrov", "Sidorov"];
        var counter = 0;

        function add_to_list() {
            if (typeof(arr[counter]) != "undefined") {
                var list = document.getElementById('list');
                var li = document.createElement('LI');
                li.innerHTML = arr[counter];
                list.appendChild(li);
                counter++;
            }
        }
    </script>
</head>
<body>
    <script language="JavaScript" src="menu.js" type="text/javascript"></script><br>
    
    <p onclick="add_to_list()">Добавить в список</p>
    <button type="reset">Очистить</button>
    <ul id="list"></ul>
</body>
</html>
