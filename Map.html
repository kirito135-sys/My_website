<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Изображения-карты</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .map-section {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #444;
            border-radius: 8px;
        }
        .map-section h2 {
            color: #4da6ff;
            margin-top: 0;
        }
        .map-section img {
            display: block;
            margin: 15px 0;
            border: 2px solid #4da6ff;
            border-radius: 4px;
        }
        .legend {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
        }
        .legend h3 {
            color: #4da6ff;
            margin-top: 0;
        }
        .legend ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .legend li {
            padding: 4px 0;
            border-bottom: 1px solid #333;
        }
        .legend li:last-child {
            border-bottom: none;
        }
        .legend a {
            color: #4da6ff;
            text-decoration: none;
        }
        .legend a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="menu">
        <script src="menu.js"></script>
    </div>
        <img src="прямоугольник.gif" 
             alt="Прямоугольник с диагоналями" 
             usemap="#rectmap" 
             width="300" height="200">

        <map name="rectmap">
            <!-- Верхний треугольник (красный) -->
            <area shape="poly" 
                  coords="0,0,300,0,150,100" 
                  href="index.html" 
                  alt="Главная страница" 
                  title="Переход на главную страницу">
            
            <!-- Правый треугольник (жёлтый) -->
            <area shape="poly" 
                  coords="300,0,300,200,150,100" 
                  href="table.html" 
                  alt="Таблицы" 
                  title="Переход к таблицам">
            
            <!-- Нижний треугольник (розовый) -->
            <area shape="poly" 
                  coords="300,200,0,200,150,100" 
                  href="anketa.html" 
                  alt="Анкета" 
                  title="Переход к анкете">
            
            <!-- Левый треугольник (голубой) -->
            <area shape="poly" 
                  coords="0,200,0,0,150,100" 
                  href="Dynamicchange.html" 
                  alt="Динамическое изменение" 
                  title="Переход к динамическому изменению">
        </map>

    <br>
        <img src="город.gif" 
             alt="Карта города" 
             usemap="#citymap" 
             width="800" height="600">

        <map name="citymap">
            
            <!-- Главная улица (горизонтальная, по центру сверху) -->
            <area shape="rect" 
                  coords="50,200,750,230" 
                  alt="Главная улица" 
                  title="Главная улица — центральная магистраль района">

            <!-- Проспект Мира (вертикальный, слева) -->
            <area shape="rect" 
                  coords="150,50,180,550" 
                  alt="Проспект Мира" 
                  title="Проспект Мира — главный проспект">

            <!-- Улица Ленина (горизонтальная, сверху) -->
            <area shape="rect" 
                  coords="180,100,750,130" 
                  alt="Улица Ленина" 
                  title="Улица Ленина">

            <!-- Советская улица (горизонтальная, снизу) -->
            <area shape="rect" 
                  coords="180,470,750,500" 
                  alt="Советская улица" 
                  title="Советская улица">

            <!-- Кольцевая дорога (большой прямоугольник по краям) -->
            <area shape="poly" 
                  coords="50,50,750,50,750,550,50,550,50,50" 
                  alt="Кольцевая дорога" 
                  title="Кольцевая дорога — объездная вокруг района">

            <!-- Улица Пушкина (вертикальная, в центре) -->
            <area shape="rect" 
                  coords="400,130,430,470" 
                  alt="Улица Пушкина" 
                  title="Улица Пушкина">

            <!-- Центральный переулок (маленькая вертикальная дорога) -->
            <area shape="rect" 
                  coords="550,130,580,470" 
                  alt="Центральный переулок" 
                  title="Центральный переулок">

            <!-- Набережная (вдоль реки справа) -->
            <area shape="rect" 
                  coords="720,50,750,550" 
                  alt="Набережная" 
                  title="Набережная реки">

        </map>
</body>
</html>
