<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Анкета</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript">
        function sendForm(form) {
            // Проверяем, что имя заполнено
            if (form.name.value.trim() == "") {
                alert("Заполните поле 'Ваше имя'!");
                form.name.focus();
                return false;
            }

            // Предотвращаем стандартную отправку формы (перезагрузку страницы)
            // Данные остаются в полях
            alert("Анкета успешно отправлена!\n\nИмя: " + form.name.value +
                  "\nПол: " + (form.gender.value || "не выбран") +
                  "\nКурс: " + form.course.value +
                  "\nЯзыки: " + getCheckedLanguages(form));

            return false; // ← это главное: форма НЕ перезагружается, данные не сбрасываются
        }

        function getCheckedLanguages(form) {
            var langs = [];
            if (form.pascal.checked) langs.push("Паскаль");
            if (form.clang.checked) langs.push("СИ");
            if (form.asm.checked) langs.push("Ассемблер");
            return langs.length > 0 ? langs.join(", ") : "не выбраны";
        }

        function clearForm(form) {
            form.name.value = "";
            form.gender[0].checked = false;
            form.gender[1].checked = false;
            form.course.selectedIndex = 0;
            form.pascal.checked = false;
            form.clang.checked = false;
            form.asm.checked = false;
        }
    </script>
</head>
<body>

    <div id="menu">
        <script src="menu.js"></script>
    </div>

    <h1>Анкета</h1>

    <form name="anketa" onsubmit="return sendForm(this)">
        <p>Ваше имя: <input type="text" name="name"></p>

        <p>Ваш пол:
            <label><input type="radio" name="gender" value="женский"> женский</label>
            <label><input type="radio" name="gender" value="мужской"> мужской</label>
        </p>

        <p>Ваш курс?
            <select name="course">
                <option value="первый">первый</option>
                <option value="второй">второй</option>
                <option value="третий">третий</option>
                <option value="четвёртый">четвёртый</option>
            </select>
        </p>

        <p>Какие языки программирования вы знаете?</p>
        <p>
            <label><input type="checkbox" name="pascal"> Паскаль</label><br>
            <label><input type="checkbox" name="clang"> СИ</label><br>
            <label><input type="checkbox" name="asm"> Ассемблер</label>
        </p>

        <p>
            <input type="submit" value="Отправить">
            <input type="button" value="Очистить" onclick="clearForm(this.form)">
        </p>
    </form>

</body>
</html>
