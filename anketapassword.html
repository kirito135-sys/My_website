<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ex15 — Форма заполнения данных</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript">
        function checkForm(form) {
            if (form.name.value == "") {
                alert("Заполните поле 'Ваше имя'!");
                form.name.focus();
                return false;
            }
            if (form.password.value.length <= 4) {
                alert("Пароль должен содержать больше 4 символов!");
                form.password.focus();
                return false;
            }
            if (form.password.value != form.password2.value) {
                alert("Пароли не совпадают!");
                form.password2.focus();
                return false;
            }
            if (form.email.value == "" || form.email.value.indexOf("@") == -1) {
                alert("Заполните поле 'Электронный адрес' и убедитесь, что он содержит символ @!");
                form.email.focus();
                return false;
            }
            if (form.message.value.length <= 10) {
                alert("Сообщение должно содержать больше 10 символов!");
                form.message.focus();
                return false;
            }
            alert("Форма успешно заполнена!");
            return false;
        }
    </script>
</head>
<body>

    <div id="menu">
        <script src="menu.js"></script>
    </div>

    <h1>Ex15. Форма заполнения данных</h1>

    <form name="myForm" onsubmit="return checkForm(this)">
        <p>Ваше имя*: <input type="text" name="name"></p>
        <p>Пароль*: <input type="password" name="password"></p>
        <p>Подтверждение пароля*: <input type="password" name="password2"></p>
        <p>Электронный адрес*: <input type="text" name="email"></p>
        <p>Тема сообщения: <input type="text" name="subject"></p>
        <p>Сообщение: <textarea name="message" rows="5" cols="40"></textarea></p>
        <p>
            <input type="submit" value="Отправить">
            <input type="reset" value="Очистить">
        </p>
        <p><i>* — необходимые для заполнения поля</i></p>
    </form>

</body>
</html>
