<!DOCTYPE html>
<html lang="ru">
<head>
  <title>Светофор</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu"><script src="menu.js"></script></div>
  <h1>Светофор</h1>
  <p>Нажмите на светофор, чтобы переключить сигнал.</p>

  <button class="traffic-light" onclick="switchLight()" aria-label="Переключить сигнал светофора">
    <span class="lamp red active"></span>
    <span class="lamp yellow"></span>
    <span class="lamp green"></span>
  </button>

  <p>Сейчас горит: <strong id="status">Красный</strong></p>
  <script>
    let current = 0;
    const lamps = document.querySelectorAll(".lamp");
    const names = ["Красный", "Жёлтый", "Зелёный"];

    function switchLight() {
      lamps[current].classList.remove("active");
      current = (current + 1) % 3;
      lamps[current].classList.add("active");
      document.getElementById("status").textContent = names[current];
    }
  </script>
</body>
</html>
